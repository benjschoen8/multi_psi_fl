# All algorithm in the same experiment use same confing file
# 1. Settings
exp_name: "model-heterogeneity" # name of experiment
heterogeneous: True # whether to use heterogeneous model architecture

# 2. Basic args for Federated Learning
dirichlet_alpha: 0.1
global_rounds: 1 # mps timing run
local_epochs: 1 # epochs of local update
local_loss_fn: 'CrossEntropyLoss' # loss fn name in torch.nn.*
local_optim: 'Adam'  # optimizer name in torch.optim.*, e.g. Adam, SGD
local_lr: 1e-3 # learning rate of local update
batch_size: 64 # batch_size of local update
sample_frac: 1.0 # select fraction of clients
test_interval: 1
metric_type: 'accuracy'
global_feature_dim : 256 # = generator feature dimension = classifier input dimension 

optim: 'Adam' 
optim_lr: 1e-3

aid_by_gen: False

# args for image generator training
global_gen_epochs : 10
gen_noise_dim: 128
gen_optim: 'Adam' # optimizer name for image-generator in torch.optim.*, e.g. Adam, SGD
gen_optim_lr: 1e-3 # learning rate of image-generator optimizer

# DDPM
n_feat: 64
ddpm_guide_w: 1.5

# args for feature generator training
global_feat_gen_epochs : 10
feat_gen_noise_dim: 128
feat_gen_optim: 'Adam' # optimizer name for feature-generator in torch.optim.*, e.g. Adam, SGD
feat_gen_optim_lr: 1e-3 # learning rate of feature-generator optimizer
feat_gen_div_beta: 1.0

public_data_ratio: 0.05 # ratio of public data used for global full model update

# args for Ours
start_mapping_epoch: 25 # epoch to start learning local-to-global mapping
gen_observer_weight: 0.0 # weight for feature-generator observer loss
index_matching: 'ddpm' # method for index matching, 'class_name', 'real_image', 'gan', 'ddpm', 'independent', 'identical'
use_new_entropy_method: True
# entropy_ratio: 0.75
entropy_ratio: 0.25
missing_threshold: 0.25
cs_threshold: 0.9

# global model
global_model_epochs: 5
#global_model_epochs: 100
global_model_optim: 'Adam' # optimizer name for global inference model in torch.optim.*, e.g. Adam, SGD
global_model_optim_lr: 1e-3 # learning rate of global inference model optimizer

global_samples_per_class: 64 # number of samples per class to train global inference model

# slam dunk
slam_epochs: 50
slam_lr: 1e-4
slam_batch_size: 64
slam_samples_per_label: 64
slam_lambda: 0.5
slam_feat_dim: 256
slam_relation_threshold: 0.0
slam_standalone_margin: 1.5
slam_max_relation_order: 2

# ---- RT protocol (server_new.py) ----
rt_method: attn_filter
rt_psi: circuit
rt_anchor_datasets: [FashionMNIST, USPS, CIFAR100]
rt_num_anchors: 300
rt_min_samples: 10
# rt_ladder: [0.90, 0.85, 0.80, 0.75, 0.70, 0.65, 0.60, 0.55, 0.50, 0.45, 0.40]   # reset from rt_diag_plots/summary.txt
rt_group_by: dataset
rt_max_classes: 0
rt_exemplars_per_class: 0  # offline preprocessing: use all available local samples
rt_attn_match: precision
rt_coord: log_whiten
rt_verify_floor: 0.90
rt_verify_margin: 0.01
rt_only: false
rt_ladder_aff: [0.99, 0.985, 0.98, 0.975, 0.97, 0.965, 0.96, 0.955, 0.95]
rt_ladder_desc: [0.95, 0.9, 0.85, 0.8]
max_client_samples: 2000   # Mac small-scale: cap each client's training set
rt_client_langs: [en, zh, es]          # language each client writes its own descriptions in (cycled by client id)
rt_text_encoders: [paraphrase-multilingual-MiniLM-L12-v2]   # each client's own text encoder (cycled); only the anchor LIST is shared
# rt_descriptions: path/to/descriptions.json   # {"<client_id>": {"<local_id>": "text"}} overrides generated descriptions
rt_tau: 0.05
